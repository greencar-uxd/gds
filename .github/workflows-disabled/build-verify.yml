name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zstd 압축 해제(zlib.zstdDecompressSync)는 Node 22.15+ 에서만 동작합니다
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 토큰 생성
        run: npm run tokens

      - name: 사이트 빌드
        run: npm run build

      - name: 기계 검증
        run: npm run check

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
