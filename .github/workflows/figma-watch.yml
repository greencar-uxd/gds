name: Figma 변경 감지

on:
  schedule:
    # 하루 1회 — UTC 00:10 (한국시간 09:10). 30분 폴링에서 변경, 2026-08-04
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: figma-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 원본 version 확인
        id: watch
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set +e
          node tools/figapi/watch.js 2>&1 | tee /tmp/watch.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 변경 없음
        if: steps.watch.outputs.code == '0'
        run: echo "변경 없음 — 종료"

      # 실패 원인을 주석(annotation)에 그대로 실어야 알림만 보고도 판단할 수 있습니다.
      # 예전에는 "토큰과 스코프를 점검하세요" 만 찍혀서 로그를 열어봐야 원인을 알 수 있었습니다.
      - name: 감지 실패
        if: steps.watch.outputs.code != '0' && steps.watch.outputs.code != '10'
        run: |
          REASON=$(tail -n 4 /tmp/watch.log | tr '\n' ' ' | sed 's/  */ /g')
          echo "::error::Figma 확인 실패 (exit ${{ steps.watch.outputs.code }}) — $REASON"
          case "$REASON" in
            *"Token expired"*|*403*)
              echo "::error::FIGMA_TOKEN 이 만료됐습니다. Figma → Settings → Security → Personal access tokens 에서 새로 발급(File content: Read-only)한 뒤 저장소 Settings → Secrets and variables → Actions 의 FIGMA_TOKEN 을 교체하세요." ;;
            *"FIGMA_TOKEN 이 없습니다"*)
              echo "::error::FIGMA_TOKEN 시크릿이 저장소에 없습니다." ;;
          esac
          exit 1

      - name: 변경 기록 커밋
        if: steps.watch.outputs.code == '10'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/figma-version.json data/figma-change.json
          git commit -m "chore: Figma 원본 변경 감지 (자동)" || exit 0
          git push

      - name: 이슈 본문 생성
        if: steps.watch.outputs.code == '10'
        run: node tools/figapi/issue-body.js > /dev/null

      - name: 이슈 생성
        if: steps.watch.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "GDS 원본 변경 감지 — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/issue.md
