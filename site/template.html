<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDS — 그린카 디자인 시스템 Foundation</title>
<style>
:root{
  --bg:#fff;--surface:#f7f8f9;--surface2:#eef0f2;--line:#e1e4e8;
  --text:#16191d;--text2:#5b6470;--text3:#8b95a1;
  --accent:#2d5bff;--accent-soft:#eaefff;--ok:#0f9960;--warn:#e8850c;--danger:#e5484d;
  --r:8px;--r2:12px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --nav:248px;
}
[data-theme=dark]{--bg:#0e1116;--surface:#161b22;--surface2:#1d242d;--line:#2a323c;
  --text:#e6edf3;--text2:#9aa7b4;--text3:#6e7b8a;--accent:#5b82ff;--accent-soft:#1a2340}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:var(--accent);text-decoration:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;background:var(--surface2);padding:1px 5px;border-radius:4px}
h1{font-size:28px;font-weight:700;margin:0 0 var(--s3);letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;margin:var(--s7) 0 var(--s3);letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;margin:var(--s5) 0 var(--s3)}
p{margin:0 0 var(--s3)}
.lead{color:var(--text2);margin:0 0 var(--s5)}

/* layout */
.shell{display:flex;min-height:100vh}
nav.side{width:var(--nav);flex:0 0 var(--nav);border-right:1px solid var(--line);background:var(--surface);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:var(--s5) 0}
nav.side .brand{padding:0 var(--s5) var(--s5);border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
nav.side .brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
nav.side .brand span{font-size:11.5px;color:var(--text3)}
nav.side a{display:block;padding:8px var(--s5);color:var(--text2);font-size:14px;border-left:2px solid transparent;cursor:pointer}
nav.side a:hover{background:var(--surface2);color:var(--text)}
nav.side a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
nav.side .grp{padding:var(--s4) var(--s5) var(--s1);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);font-weight:600}
main{flex:1;min-width:0;padding:var(--s7) var(--s7) var(--s8);max-width:1100px}
@media(max-width:860px){.shell{flex-direction:column}nav.side{width:100%;height:auto;position:static;flex:none}main{padding:var(--s5)}}

.topbar{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s5)}
.topbar .grow{flex:1}
button,input{font:inherit}
button{font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 12px;cursor:pointer}
button:hover{background:var(--surface2)}
input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 12px;color:var(--text);min-width:240px}

.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;vertical-align:2px}
.t-fact{background:#e3f2ea;color:#0b6b45}.t-int{background:#fff2dc;color:#95590a}
.t-inf{background:#e9edff;color:#2a3fa8}.t-unk{background:#f2f3f5;color:#5b6470}
[data-theme=dark] .t-fact{background:#0d3a27;color:#5fd3a0}[data-theme=dark] .t-int{background:#3d2c0c;color:#f0b45e}
[data-theme=dark] .t-inf{background:#1c2450;color:#8ea3ff}[data-theme=dark] .t-unk{background:#232a33;color:#9aa7b4}

.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);
  border-radius:var(--r);padding:var(--s4) var(--s5);margin:var(--s4) 0}
.callout.ok{border-left-color:var(--ok)}.callout.warn{border-left-color:var(--warn)}.callout.danger{border-left-color:var(--danger)}
.callout p:last-child{margin-bottom:0}
.callout h4{margin:0 0 var(--s2);font-size:14px}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3);margin:var(--s4) 0 var(--s5)}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4)}
.kpi b{display:block;font-size:25px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--text2)}
.kpi div.hot b{color:var(--danger)}

table{border-collapse:collapse;width:100%;margin:var(--s3) 0 var(--s5);font-size:13.5px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--text2);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;background:var(--surface)}
tbody tr:hover{background:var(--surface)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* color */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:var(--s3)}
.sw{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.sw i{display:block;height:56px;border-bottom:1px solid var(--line)}
.sw div{padding:7px 9px}
.sw b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw span{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.dup{color:var(--warn);font-weight:600}
details{border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s3);background:var(--surface)}
details>summary{cursor:pointer;padding:10px var(--s4);font-size:14px;font-weight:600;list-style:none;display:flex;gap:var(--s2);align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--text3);font-size:12px}
details[open]>summary::before{content:"▾"}
details>summary .c{margin-left:auto;font-weight:400;font-size:12px;color:var(--text3)}
details .body{padding:0 var(--s4) var(--s4)}

/* type */
.ty{border-bottom:1px solid var(--line);padding:var(--s4) 0;display:grid;grid-template-columns:1fr 260px;gap:var(--s4);align-items:baseline}
@media(max-width:720px){.ty{grid-template-columns:1fr}}
.ty .sample{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ty .meta{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums;text-align:right}
@media(max-width:720px){.ty .meta{text-align:left}}
.ty .meta b{color:var(--text2);font-weight:600}

/* radius */
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--s4)}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);text-align:center}
.spec .stage{height:112px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:var(--s2)}
.spec .lbl{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.spec .lbl b{color:var(--text)}
.box{background:var(--accent)}.box.b{background:var(--text3)}

/* elevation */
.elev-stage{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s6);
  display:flex;flex-wrap:wrap;gap:var(--s6);justify-content:center}
.card{width:132px;height:52px;background:var(--bg);border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--text2);border:1px solid rgba(128,128,128,.12)}
.bar{height:7px;border-radius:4px;background:var(--accent)}

.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--text2)}
.pill.done{border-color:var(--ok);color:var(--ok)}
.pill.wip{border-color:var(--warn);color:var(--warn)}
footer{margin-top:var(--s8);padding-top:var(--s5);border-top:1px solid var(--line);color:var(--text3);font-size:12.5px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="shell">
<nav class="side">
  <div class="brand"><b>GDS</b><span>그린카 디자인 시스템 · Foundation</span></div>
  <div class="grp">시작</div>
  <a data-go="overview" class="on">개요</a>
  <div class="grp">Foundation</div>
  <a data-go="color">색</a>
  <a data-go="type">타이포그래피</a>
  <a data-go="radius">반경 (Radius)</a>
  <a data-go="elevation">엘리베이션</a>
  <div class="grp">현황</div>
  <a data-go="inventory">페이지 인벤토리</a>
</nav>
<main>
  <div class="topbar">
    <span class="grow"></span>
    <button id="theme">다크</button>
  </div>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = v => v.toLocaleString();

/* ---------- 확정 결정 (회의 2026-07-28) ---------- */
const TABLE_A = [['xsmall',[8,12,16],[2,2,2]],['small',[20,24,32],[4,4,4]],
  ['medium',[40,48,56,64],[6,6,8,8]],['large',[72,80],[10,10]],['xlarge',[96,120],[12,12]]];
const TABLE_B = [
  ['Xsmall',[8,12,16],[4,4,8],'Element'],
  ['Small',[20,24,32],[8,10,10],'Chips, Checkbox, Radio button, Switch, Tag'],
  ['Medium',[40,48,56,64],[12,12,14,14],'Button, Text input, Textarea, Select, Carousel-Number, Step indicator, Pagination'],
  ['Large',[72,80],[16,16],'Card, Dialog'],
  ['Xlarge',[96,120],[20,20],'Banner, Dialog, Bottom sheet']];
const SCALE = [4,8,10,12,16,20];

const uniqHex = new Set(D.colors.map(c=>c.hex));
const famCount = {}; D.types.forEach(t=>{const k=t.family||'(없음)';famCount[k]=(famCount[k]||0)+1});
const sizes = [...new Set(D.types.map(t=>t.size).filter(Boolean))].sort((a,b)=>b-a);
const elevStyles = D.effects.filter(e=>/^elevation/i.test(e.name));
const pageCount = m => D.pages.filter(p=>p.mark===m).length;

/* ---------- 공통 ---------- */
const banner = `<div class="callout warn">
  <h4>이 사이트가 보여주는 것 / 보여주지 않는 것</h4>
  <p><strong>보여주는 것</strong> — 원본 <code>.fig</code>에서 직접 읽은 <strong>현재 상태</strong>입니다. 손으로 적은 숫자는 없습니다 <span class="tag t-fact">팩트</span></p>
  <p style="margin-top:6px"><strong>보여주지 않는 것</strong> — 정리가 끝난 <strong>GDS 토큰 273개(정본)</strong>는 아직 들어 있지 않습니다.
  색·타이포는 <strong>정리 대상인 레거시 스타일</strong>이지 확정된 토큰이 아닙니다. 반경·엘리베이션만 회의 결정이 반영된 정본입니다.</p>
</div>`;

/* ---------- 개요 ---------- */
function overview(){
  return `<h1>GDS Foundation</h1>
  <p class="lead">그린카 디자인 시스템의 기반 값을 한곳에서 봅니다.
  원본 <code>${esc(D.meta.source)}</code> (export ${D.meta.exported.slice(0,10)}) 실측 기준.</p>
  ${banner}
  <h2>규모</h2>
  <div class="kpi">
    <div><b>${n(D.meta.nodeChanges)}</b><span>노드</span></div>
    <div><b>${D.meta.pages}</b><span>페이지</span></div>
    <div><b>${n(D.meta.variables)}</b><span>변수 (Variables)</span></div>
    <div><b>${n(D.meta.styles.FILL+D.meta.styles.TEXT+D.meta.styles.EFFECT)}</b><span>스타일</span></div>
  </div>
  <h2>페이지 정의 상태</h2>
  <div class="kpi">
    <div><b>${pageCount('done')}</b><span>✅ 정의 완료</span></div>
    <div><b>${pageCount('wip')}</b><span>🚧 작업 중</span></div>
    <div><b>${pageCount('none')}</b><span>— 미분류</span></div>
  </div>
  <h2>회의에서 확정된 결정 <span class="tag t-fact">팩트</span></h2>
  <table><thead><tr><th>항목</th><th>결정</th><th>상태</th></tr></thead><tbody>
    <tr><td><strong>R-3</strong> 반경 상한</td><td><strong>20px</strong> (표 B 채택)</td><td>확정 · 토큰 반영 대기</td></tr>
    <tr><td><strong>E-2</strong> 그림자 불투명도</td><td><strong>15%</strong></td><td>확정 · 원본 반영 확인</td></tr>
  </tbody></table>
  <h2>가장 큰 정리 과제 <span class="tag t-int">해석</span></h2>
  <div class="callout danger">
    <p>색 스타일 <strong>${n(D.colors.length)}개</strong>가 실제로는 고유 색 <strong>${uniqHex.size}개</strong>뿐입니다 —
    <strong>${n(D.colors.length-uniqHex.size)}개가 같은 값의 중복</strong>입니다.
    이름 그룹도 <strong>${new Set(D.colors.map(c=>(c.name.split('/')[0]||'').trim())).size}개</strong>로 갈라져 있습니다.</p>
    <p style="margin-top:6px">폰트도 <strong>${Object.keys(famCount).length}종</strong>이 섞여 있습니다
    (대소문자만 다른 중복 포함). 이것이 "파편적 개발로 시스템이 망가지는 중"의 실제 모습입니다.</p>
  </div>`;
}

/* ---------- 색 ---------- */
function color(){
  const groups = {};
  D.colors.forEach(c=>{const k=(c.name.split('/')[0]||'(기타)').trim()||'(기타)';(groups[k]=groups[k]||[]).push(c)});
  const hexCount = {}; D.colors.forEach(c=>hexCount[c.hex]=(hexCount[c.hex]||0)+1);
  const ordered = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  return `<h1>색</h1>
  <p class="lead">원본의 <strong>FILL 스타일 전수</strong>입니다. 확정 토큰이 아니라 <strong>정리 대상 현황</strong>입니다.</p>
  <div class="kpi">
    <div><b>${n(D.colors.length)}</b><span>색 스타일</span></div>
    <div><b>${uniqHex.size}</b><span>고유 HEX</span></div>
    <div class="hot"><b>${n(D.colors.length-uniqHex.size)}</b><span>중복</span></div>
    <div><b>${ordered.length}</b><span>이름 그룹</span></div>
  </div>
  <div class="topbar"><input type="search" id="cq" placeholder="색 이름 또는 HEX 검색 (예: gray, #143C56)"><span class="grow"></span>
    <button id="cdup">중복만 보기</button></div>
  <div id="clist">${ordered.map(([g,list])=>`
    <details${list.length>40?'':' open'}><summary>${esc(g)}<span class="c">${list.length}개</span></summary>
      <div class="body"><div class="sw-grid">${list.map(c=>`
        <div class="sw" data-name="${esc(c.name.toLowerCase())}" data-hex="${c.hex.toLowerCase()}" data-dup="${hexCount[c.hex]>1?1:0}">
          <i style="background:${c.hex}"></i>
          <div><b title="${esc(c.name)}">${esc(c.name)}</b>
          <span>${c.hex}${hexCount[c.hex]>1?` <span class="dup">×${hexCount[c.hex]}</span>`:''}</span></div>
        </div>`).join('')}</div></div>
    </details>`).join('')}</div>`;
}

/* ---------- 타이포 ---------- */
function type(){
  const byFam = {}; D.types.forEach(t=>{const k=t.family||'(없음)';(byFam[k]=byFam[k]||[]).push(t)});
  const ordered = Object.entries(byFam).sort((a,b)=>b[1].length-a[1].length);
  const lh = t => t.lineHeight ? (t.lineHeight.u==='PIXELS'?t.lineHeight.v+'px':t.lineHeight.u==='PERCENT'?t.lineHeight.v+'%':'auto') : 'auto';
  return `<h1>타이포그래피</h1>
  <p class="lead">원본의 <strong>TEXT 스타일 전수</strong>. 아래 견본은 실제 크기·굵기를 그대로 렌더한 것입니다.</p>
  <div class="kpi">
    <div><b>${D.types.length}</b><span>텍스트 스타일</span></div>
    <div class="hot"><b>${ordered.length}</b><span>폰트 패밀리</span></div>
    <div><b>${sizes.length}</b><span>크기 종류</span></div>
    <div><b>${sizes[0]}–${sizes[sizes.length-1]}px</b><span>크기 범위</span></div>
  </div>
  <div class="callout warn"><p>폰트 패밀리가 <strong>${ordered.length}종</strong>입니다.
  <code>pretendard GOV Variable</code>과 <code>Pretendard GOV Variable</code>처럼 <strong>대소문자만 다른 중복</strong>도 있습니다 <span class="tag t-fact">팩트</span></p></div>
  ${ordered.map(([fam,list])=>`
    <details${list.length>30?'':' open'}><summary>${esc(fam)}<span class="c">${list.length}개</span></summary>
      <div class="body">${list.slice(0,60).map(t=>`
        <div class="ty">
          <div class="sample" style="font-size:${Math.min(t.size||14,34)}px;font-weight:${/bold|semibold|700|600/i.test(t.style||'')?700:/medium|500/i.test(t.style||'')?500:400};line-height:1.3">
            ${esc(t.name)}</div>
          <div class="meta"><b>${t.size||'?'}px</b> · ${esc(t.style||'?')} · 행간 ${lh(t)}</div>
        </div>`).join('')}
        ${list.length>60?`<p style="margin-top:12px;color:var(--text3);font-size:12.5px">…외 ${list.length-60}개 (표시 상한)</p>`:''}
      </div></details>`).join('')}`;
}

/* ---------- 반경 ---------- */
function radius(){
  const hist = D.radius.hist.filter(([v])=>v<200).slice(0,14);
  const max = Math.max(...hist.map(h=>h[1]));
  const specs = TABLE_B.map(([lv,szs,rs,apply],li)=>{
    const A = TABLE_A[li];
    return `<h3>${lv} <span style="font-weight:400;color:var(--text3)">— ${esc(apply)}</span></h3>
    <div class="spec-grid">${szs.map((s,i)=>{
      const d=rs[i]-A[2][i], draw=Math.min(s,96);
      return `<div class="spec"><div class="stage">
        <div class="box b" style="width:${draw}px;height:${draw}px;border-radius:${A[2][i]*draw/s}px"></div>
        <div class="box" style="width:${draw}px;height:${draw}px;border-radius:${rs[i]*draw/s}px"></div>
      </div><div class="lbl">${s}×${s}</div>
      <div class="lbl">A <b>${A[2][i]}</b> → B <b>${rs[i]}</b>${d?` <span style="color:var(--accent)">(${d>0?'+':''}${d})</span>`:''}</div>
      </div>`}).join('')}</div>`;
  }).join('');
  return `<h1>반경 (Radius)</h1>
  <div class="callout ok"><h4>✅ R-3 확정 — 상한 20px (표 B 채택)</h4>
  <p>회색 = 표 A(현행 12px 상한) · 파랑 = 표 B(확정). 실제 값을 그대로 렌더한 것입니다.</p></div>
  <h2>정본 스케일 <span class="tag t-fact">팩트</span></h2>
  <p>R-1 승인 — 로컬 7단계 <code>${SCALE.join(' / ')} / 원형</code></p>
  <div class="spec-grid" style="margin-bottom:32px">${SCALE.map(v=>`
    <div class="spec"><div class="stage"><div class="box" style="width:84px;height:84px;border-radius:${v}px"></div></div>
    <div class="lbl"><b>${v}px</b></div></div>`).join('')}
    <div class="spec"><div class="stage"><div class="box" style="width:84px;height:84px;border-radius:99px"></div></div>
    <div class="lbl"><b>원형</b></div></div></div>
  <h2>레벨별 표 A → 표 B</h2>${specs}
  <h2>실사용 분포 <span class="tag t-fact">팩트</span></h2>
  <p>반경 사용 도형 <strong>${n(D.radius.shapes)}개</strong> 기준. 정수 반경만 집계.</p>
  <table><thead><tr><th>반경</th><th class="num">건수</th><th style="width:45%"></th><th>스케일</th></tr></thead><tbody>
  ${hist.map(([v,c])=>`<tr><td><strong>${v}px</strong></td><td class="num">${n(c)}</td>
    <td><div class="bar" style="width:${(c/max*100).toFixed(1)}%;opacity:${SCALE.includes(v)?1:.3}"></div></td>
    <td>${SCALE.includes(v)?'<span class="pill done">정본</span>':'<span class="pill">비정본</span>'}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ---------- 엘리베이션 ---------- */
function elevation(){
  const sh=(l,a)=>`${l.x}px ${l.y}px ${l.blur}px ${l.spread}px rgba(0,0,0,${a})`;
  const cards = elevStyles.map(e=>{
    const shadow=e.layers.map(l=>sh(l,0.15)).join(', ');
    return `<div class="card" style="box-shadow:${shadow}">${esc(e.name)}</div>`}).join('');
  const rows = elevStyles.map(e=>`<tr><td><strong>${esc(e.name)}</strong></td>
    ${[0,1].map(i=>{const l=e.layers[i];return `<td>${l?`Y${l.y} blur${l.blur} spread${l.spread} · ${l.alpha*100!==15?`<s style="color:var(--text3)">${(l.alpha*100).toFixed(0)}%</s> → `:''}<strong>15%</strong>`:'—'}</td>`}).join('')}
  </tr>`).join('');
  const other = D.effects.filter(e=>!/^elevation/i.test(e.name));
  const max = Math.max(...D.shadow.hist.map(h=>h[1]));
  return `<h1>엘리베이션</h1>
  <div class="callout ok"><h4>✅ E-2 확정 — 그림자 불투명도 15%</h4>
  <p>Elevation은 <strong>2겹(key + ambient) 구조</strong>이고, 두 레이어 모두 15%로 통일됩니다.
  레이어 수를 줄이는 결정이 아닙니다 <span class="tag t-int">해석</span></p></div>
  <h2>단계별 견본 — 확정값 적용</h2>
  <p class="lead">다크 모드로 전환해 보시면 차이가 더 분명합니다.</p>
  <div class="elev-stage">${cards}</div>
  <h2>레이어 구성 <span class="tag t-fact">팩트</span></h2>
  <table><thead><tr><th>스타일</th><th>레이어 1 — key</th><th>레이어 2 — ambient</th></tr></thead><tbody>${rows}
  <tr style="color:var(--text3)"><td><strong>Elevation_6</strong></td><td colspan="2">07-23 스냅샷에 없음 — 값 미확인 <span class="tag t-unk">미확인</span></td></tr>
  </tbody></table>
  <h2>정리 대상 — 비 Elevation 그림자 스타일 ${other.length}개 <span class="tag t-int">해석</span></h2>
  <p>E-2 결정 범위 밖입니다. 별도 정리가 필요합니다.</p>
  <table><thead><tr><th>스타일</th><th>레이어</th></tr></thead><tbody>
  ${other.slice(0,40).map(e=>`<tr><td>${esc(e.name)}</td><td>${e.layers.map(l=>
    `${l.type==='INNER_SHADOW'?'내부 ':''}Y${l.y} blur${l.blur} · ${(l.alpha*100).toFixed(0)}%`).join(' + ')||'—'}</td></tr>`).join('')}
  </tbody></table>
  <h2>그림자 불투명도 전체 분포</h2>
  <p>그림자 효과 <strong>${n(D.shadow.total)}건</strong> 기준.</p>
  <table><thead><tr><th>불투명도</th><th class="num">건수</th><th style="width:45%"></th></tr></thead><tbody>
  ${D.shadow.hist.slice(0,10).map(([p,c])=>`<tr><td${p===15?' style="font-weight:600"':''}>${p}%</td>
    <td class="num">${n(c)}</td><td><div class="bar" style="width:${(c/max*100).toFixed(1)}%;opacity:${p===15?1:.3}"></div></td></tr>`).join('')}
  </tbody></table>`;
}

/* ---------- 인벤토리 ---------- */
function inventory(){
  const row = p=>`<tr><td>${esc(p.name)}</td><td><code>${p.id}</code></td>
    <td>${p.mark==='done'?'<span class="pill done">정의 완료</span>':p.mark==='wip'?'<span class="pill wip">작업 중</span>':'<span class="pill">미분류</span>'}</td></tr>`;
  const sec = (t,m)=>`<h2>${t} — ${pageCount(m)}개</h2><table><thead><tr><th>페이지</th><th>노드 ID</th><th>상태</th></tr></thead>
    <tbody>${D.pages.filter(p=>p.mark===m).map(row).join('')}</tbody></table>`;
  return `<h1>페이지 인벤토리</h1>
  <p class="lead">원본 파일의 전체 페이지 ${D.pages.length}개입니다.</p>
  <div class="kpi">
    <div><b>${pageCount('done')}</b><span>✅ 정의 완료</span></div>
    <div><b>${pageCount('wip')}</b><span>🚧 작업 중</span></div>
    <div><b>${pageCount('none')}</b><span>— 미분류</span></div>
  </div>
  ${sec('✅ 정의 완료','done')}${sec('🚧 작업 중','wip')}${sec('— 미분류','none')}`;
}

/* ---------- 라우팅 ---------- */
const VIEWS = {overview,color,type,radius,elevation,inventory};
function go(k){
  $('#view').innerHTML = VIEWS[k]();
  document.querySelectorAll('nav.side a').forEach(a=>a.classList.toggle('on',a.dataset.go===k));
  window.scrollTo(0,0);
  if(k==='color') bindColor();
}
document.querySelectorAll('nav.side a').forEach(a=>a.onclick=()=>go(a.dataset.go));

function bindColor(){
  const q=$('#cq'), btn=$('#cdup'); let dupOnly=false;
  const run=()=>{
    const s=(q.value||'').trim().toLowerCase();
    document.querySelectorAll('#clist .sw').forEach(el=>{
      const okQ = !s || el.dataset.name.includes(s) || el.dataset.hex.includes(s);
      const okD = !dupOnly || el.dataset.dup==='1';
      el.classList.toggle('hide', !(okQ&&okD));
    });
    document.querySelectorAll('#clist details').forEach(d=>{
      const vis=[...d.querySelectorAll('.sw')].filter(e=>!e.classList.contains('hide')).length;
      d.classList.toggle('hide',vis===0);
      if((s||dupOnly)&&vis) d.open=true;
    });
  };
  q.oninput=run;
  btn.onclick=()=>{dupOnly=!dupOnly;btn.setAttribute('aria-pressed',dupOnly);
    btn.textContent=dupOnly?'전체 보기':'중복만 보기';run()};
}
$('#theme').onclick=()=>{const r=document.documentElement,d=r.getAttribute('data-theme')==='dark';
  r.setAttribute('data-theme',d?'light':'dark');$('#theme').textContent=d?'다크':'라이트'};
$('#foot').innerHTML = `원본 <code>${esc(D.meta.source)}</code> · export ${D.meta.exported.slice(0,10)} ·
  자체 제작 kiwi 디코더로 직접 측정 (외부 의존성 0)<br>
  재현 앵커: 노드 ${n(D.meta.nodeChanges)} / 페이지 ${D.meta.pages} / 변수 ${n(D.meta.variables)} — 기존 문서와 일치 ·
  Figma 권한은 View 전용이므로 원본 반영은 디자인팀 몫입니다.`;
go('overview');
</script>
</body>
</html>
