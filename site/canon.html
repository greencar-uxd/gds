<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDS — G car Design System</title>
<style>
:root{
  --bg:#fff; --surface:#fbfbfc; --surface2:#f2f3f5; --line:#e7e9ec; --line-soft:#f1f2f4;
  --text:#0d0f11; --text2:#5a616a; --text3:#939aa3;
  --brand:#F14950; --brand-deep:#ED1C24; --brand-soft:#FBD2D3; --brand-ink:#8E1116;
  /* 크롬 accent — 원본 Primary/Red 040(메인 색) · 010 그대로입니다.
     강민관 확정 2026-08-06. 값은 build/check.js 가 원본과 대조합니다. */
  --accent:#F14950; --accent-soft:#FBD2D3;
  --ok:#00C88C; --warn:#FF8159;
  --nav:248px; --top:56px; --maxw:1240px;
  --r1:8px;--r2:12px;--r3:16px;--r4:22px;
  --sh1:0 1px 2px rgba(13,15,17,.06);
  --sh2:0 4px 16px rgba(13,15,17,.07),0 1px 3px rgba(13,15,17,.05);
  --sh3:0 18px 48px rgba(13,15,17,.12),0 2px 8px rgba(13,15,17,.06);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:72px;--s9:112px;
}
[data-theme=dark]{
  --bg:#0b0c0e; --surface:#131518; --surface2:#1b1e22; --line:#262a2f; --line-soft:#1a1d21;
  --text:#f2f4f6; --text2:#9aa2ab; --text3:#6c747d;
  --brand:#F4777C; --brand-deep:#F14950; --brand-soft:#3a1214; --brand-ink:#FBD2D3;
  --accent:#F4777C; --accent-soft:#5F0B0E;
  --sh1:0 1px 2px rgba(0,0,0,.5);
  --sh2:0 4px 16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --sh3:0 18px 48px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  font-family:"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
code{background:var(--surface2);padding:2px 6px;border-radius:5px}

/* ── 레이아웃 ── */
.shell{display:flex;min-height:100vh}
nav.side{width:var(--nav);flex:0 0 var(--nav);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:var(--s6) 0 var(--s8);
  background:var(--surface)}
.brand{padding:0 var(--s6) var(--s5)}
.brand .logo{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.brand .dot{width:22px;height:22px;border-radius:7px;
  background:var(--accent);box-shadow:none}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand span{font-size:12px;color:var(--text3);display:block;padding-left:31px}
.navgrp{padding:var(--s5) var(--s6) var(--s1);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);font-weight:700}
nav.side a.item{display:block;margin:1px var(--s4);padding:8px 14px;color:var(--text2);font-size:14.5px;
  cursor:pointer;border-radius:9px;transition:.14s}
nav.side a.item:hover{color:var(--text);background:var(--surface2)}
nav.side a.item.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
[data-theme=dark] nav.side a.item.on{color:var(--accent)}
main{flex:1;min-width:0}
.inner{max-width:var(--maxw);padding:0 var(--s7) var(--s9);margin:0 auto}
#view{animation:fade .28s ease both;min-width:0}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:900px){.shell{flex-direction:column}nav.side{width:100%;position:static;height:auto;flex:none}
  .inner{padding:var(--s6) var(--s5) var(--s8)}}

main>.bar{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s7);
  position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line-soft)}
main>.bar .grow{flex:1}
button{font:inherit;font-size:13px;color:var(--text2);background:transparent;border:1px solid var(--line);
  border-radius:7px;padding:5px 11px;cursor:pointer;transition:.12s}
button:hover{color:var(--text);background:var(--surface)}

/* ── 타이포 ── */
h1{font-size:40px;font-weight:800;letter-spacing:-.035em;margin:0 0 var(--s3);line-height:1.2}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:var(--s9) 0 var(--s4)}
h2:first-of-type{margin-top:var(--s8)}
h3{font-size:15px;font-weight:700;margin:var(--s7) 0 var(--s3);color:var(--text)}
p{margin:0 0 var(--s4)}
.lead{font-size:17px;color:var(--text2);margin-bottom:var(--s6);max-width:62ch;line-height:1.65}
.muted{color:var(--text2);font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--s3)}

/* ── 색 ── */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.sw{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface);
  cursor:pointer;transition:.16s cubic-bezier(.2,.7,.3,1);text-align:left}
.sw:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--text3)}
.sw .chip{height:84px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.14)}
.sw .info{padding:10px 12px 12px}
.sw .nm{font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:3px}
.sw .hx{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
.sw .vr{font-size:10.5px;color:var(--text3);font-family:ui-monospace,Menlo,monospace;margin-top:5px;
  word-break:break-all;line-height:1.4}

/* ── 타이포 견본 ── */
.tyrow{display:grid;grid-template-columns:118px 1fr auto;gap:var(--s5);align-items:baseline;
  padding:var(--s5) 0;border-bottom:1px solid var(--line-soft);transition:.14s}
.tyrow:hover{background:var(--surface);box-shadow:0 0 0 var(--s3) var(--surface);border-radius:2px}
.tyrow .tok{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--text3);white-space:nowrap}
.tyrow .sample{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:-.02em;color:var(--text)}
.tyrow .spec{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:ui-monospace,Menlo,monospace}
.tyrow .spec b{color:var(--text2);font-weight:600}
.tyrow .spec .use{display:inline-block;background:var(--surface2);color:var(--text2);border-radius:5px;
  padding:1px 7px;margin-right:9px;font-size:11px;font-family:inherit;letter-spacing:0}

/* ── 간격 ── */
.sprow{display:grid;grid-template-columns:130px 62px 1fr;gap:var(--s4);align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft)}
.sprow .tok{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.sprow .px{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text2);text-align:right}
.sprow .vis{height:14px;background:var(--brand);border-radius:3px;opacity:.85}
.sprow.bad .vis{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 5px,transparent 5px,transparent 10px)}
.sprow.bad .tok{color:var(--warn)}

/* ── 반경 ── */
.elevgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s5);margin-top:var(--s5)}
.elevcard{background:var(--bg);border-radius:14px;padding:var(--s5);border:1px solid rgba(128,128,128,.10)}
.elevcard .nm{font-size:14px;font-weight:700;margin-bottom:3px}
.elevcard .meta{font-size:11.5px;color:var(--text3);font-family:ui-monospace,Menlo,monospace;line-height:1.6;word-break:break-all}
.elevcard .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;
  background:var(--brand-soft);color:var(--brand);margin-left:6px;vertical-align:2px}
.elevstage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:var(--s7) var(--s5)}
.radgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--s4)}
.rad{border:1px solid var(--line);border-radius:11px;padding:var(--s5);text-align:center;background:var(--surface)}
.rad .box{width:96px;height:96px;background:var(--brand);margin:0 auto var(--s3)}
.rad .tok{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--text3)}
.rad .val{font-size:15px;font-weight:700;margin-bottom:2px}

/* ── 히어로 ── */
/* 히어로 — 문서가 자기 색으로 칠해져 있으면 아래 스와치가 UI 의 일부처럼 보입니다.
   배경은 종이로 두고, 색은 «값을 보여주는 곳»에서만 씁니다. */
.hero{margin:0 calc(var(--s7) * -1) var(--s7);padding:var(--s8) var(--s7) var(--s7);
  border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero .inner2{position:relative;max-width:var(--maxw)}
.hero h1{font-size:clamp(38px,5.2vw,58px);line-height:1.06;margin-bottom:var(--s4);
  letter-spacing:-.045em}
.hero .lead{max-width:58ch;margin-bottom:var(--s6);font-size:17px}
.hero .cta{display:flex;gap:var(--s2);flex-wrap:wrap}
.hero .cta a{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;
  font-size:14px;font-weight:600;transition:.15s;border:1px solid var(--line)}
.hero .cta a.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
[data-theme=dark] .hero .cta a.pri{color:#0b0c0e}
.hero .cta a.pri:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.hero .cta a.sec{color:var(--text2)}
.hero .cta a.sec:hover{color:var(--text);background:var(--surface2)}
/* 원본 색을 얇은 띠 하나로 — 히어로가 색을 «설명»하지 «착용»하지 않습니다. */
.heroramp{display:flex;height:6px;border-radius:99px;overflow:hidden;margin:var(--s7) 0 0}
.heroramp i{flex:1}
.herostat{display:flex;flex-wrap:wrap;gap:var(--s7);margin-top:var(--s5);
  padding-top:var(--s5);border-top:1px solid var(--line)}
.herostat div b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.herostat div span{font-size:12.5px;color:var(--text3)}
.pagehead{padding-top:var(--s7)}
.sectionline{display:flex;align-items:center;gap:var(--s3);margin:var(--s8) 0 var(--s5)}
.sectionline h2{margin:0;white-space:nowrap}
.sectionline i{flex:1;height:1px;background:var(--line);display:block}

/* ── 색: 대표 · 램프 ── */
.feature{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:var(--s5);
  align-items:stretch;margin:var(--s5) 0 var(--s7)}
@media(max-width:820px){.feature{grid-template-columns:1fr}}
.feature .big{border-radius:var(--r4);padding:var(--s7) var(--s6);color:#fff;display:flex;
  flex-direction:column;justify-content:flex-end;min-height:230px;box-shadow:var(--sh2);cursor:pointer}
.feature .big .role{font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.feature .big .nm{font-size:25px;font-weight:800;letter-spacing:-.03em}
.feature .big .hx{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;opacity:.82;margin-top:4px}
.feature .side{display:flex;flex-direction:column;gap:var(--s3);justify-content:center}
.newtag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  padding:1px 5px;border-radius:99px;background:var(--ok);color:#04231a;vertical-align:1px}
.al{color:var(--text3);font-size:10px}
.chip.alpha{background-color:#fff;
  background-image:linear-gradient(var(--c),var(--c)),
    linear-gradient(45deg,#e6e8ea 25%,transparent 25%,transparent 75%,#e6e8ea 75%),
    linear-gradient(45deg,#e6e8ea 25%,transparent 25%,transparent 75%,#e6e8ea 75%);
  background-size:100% 100%,12px 12px,12px 12px;background-position:0 0,0 0,6px 6px}
.ramp{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface)}
.ramp .strip{display:flex;height:56px}
.ramp .strip i{flex:1;display:block}
.ramp .cap{display:flex;justify-content:space-between;padding:9px 14px;font-size:11.5px;color:var(--text3);
  font-family:ui-monospace,Menlo,monospace}
.groupcard{border:1px solid var(--line);border-radius:var(--r4);padding:var(--s5) var(--s5) var(--s6);
  background:var(--bg);margin-bottom:var(--s5);box-shadow:var(--sh1)}
.groupcard>.hd{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.groupcard>.hd h3{margin:0;font-size:16px}
.groupcard>.hd .cnt{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:2px 9px;border-radius:99px}
[data-theme=dark] .groupcard>.hd .cnt{color:var(--accent)}
.groupcard>.hd span.ds{font-size:12.5px;color:var(--text3)}

/* ── 본문 + 우측 목차 ── */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:var(--s8);align-items:start}
@media(max-width:1240px){.layout{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:calc(var(--top) + var(--s5));font-size:13px;line-height:1.5}
.toc .ttl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);
  font-weight:700;margin-bottom:var(--s3)}
.toc a{display:block;padding:5px 0 5px 12px;color:var(--text3);border-left:2px solid var(--line);
  transition:.14s;cursor:pointer}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:700}
[data-theme=dark] .toc a.on{color:var(--accent)}
.toc a.sub{padding-left:24px;font-size:12.5px}

/* ── Overview 카드 ── */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:var(--s4);margin:var(--s5) 0}
.ovcard{border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;background:var(--bg);
  cursor:pointer;transition:.18s cubic-bezier(.2,.7,.3,1);box-shadow:var(--sh1)}
.ovcard:hover{transform:translateY(-4px);box-shadow:var(--sh3);border-color:var(--text3)}
.ovcard .thumb{height:132px;background:var(--surface2);display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--line);overflow:hidden}
.ovcard .meta{padding:var(--s4) var(--s5) var(--s5)}
.ovcard .meta b{display:block;font-size:15px;font-weight:700;margin-bottom:3px}
.ovcard .meta span{font-size:12.5px;color:var(--text3);line-height:1.5}
.thumb .grid9{display:grid;grid-template-columns:repeat(3,26px);grid-auto-rows:26px;gap:5px}
.thumb .grid9 i{display:block;border-radius:5px}
.thumb .layers i{display:block;height:13px;border-radius:4px;background:var(--bg);
  box-shadow:0 3px 9px rgba(0,0,0,.16);margin-bottom:7px}
.thumb .spbar{display:flex;align-items:flex-end;gap:5px;height:58px}
.thumb .spbar i{display:block;width:11px;background:var(--brand);border-radius:3px;opacity:.9}

/* ── 탭 ── */
.tabs{display:flex;gap:var(--s5);border-bottom:1px solid var(--line);margin:var(--s6) 0 var(--s5)}
.tabs button{border:0;background:none;padding:0 0 11px;font-size:14.5px;color:var(--text3);
  border-bottom:2px solid transparent;border-radius:0;font-weight:600}
.tabs button:hover{color:var(--text);background:none}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.pane[hidden]{display:none}

/* ── 대비 표 ── */
table.ctr{border-collapse:collapse;width:100%;font-size:13.5px;margin:var(--s4) 0}
table.ctr th,table.ctr td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
table.ctr th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);font-weight:700}
table.ctr .ok{color:var(--ok);font-weight:600}
table.ctr .no{color:var(--brand-deep);font-weight:600}
table.ctr .dot{display:inline-block;width:12px;height:12px;border-radius:99px;margin-right:7px;
  vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}

/* ── 공통 ── */
.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);
  border-radius:9px;padding:var(--s4) var(--s5);margin:var(--s5) 0;font-size:14px}
.note.warn{border-left-color:var(--warn)}
.note b{font-weight:700}
.note p:last-child{margin-bottom:0}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:var(--s4) var(--s5);
  overflow-x:auto;font-size:12.5px;line-height:1.65;margin:var(--s3) 0 var(--s5)}
pre code{background:none;padding:0}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3);margin:var(--s4) 0 var(--s6)}
.dl a{border:1px solid var(--line);border-radius:var(--r3);padding:var(--s4) var(--s5);background:var(--surface);
  display:block;transition:.16s cubic-bezier(.2,.7,.3,1)}
.dl a:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--sh2)}
.dl b{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px}
.dl span{font-size:12.5px;color:var(--text3)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--s3);margin:var(--s6) 0}
.stat div{padding:var(--s4) var(--s5);border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.stat b{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.stat span{font-size:12.5px;color:var(--text3)}
footer{border-top:1px solid var(--line);padding-top:var(--s5);margin-top:var(--s9);
  font-size:12.5px;color:var(--text3);line-height:1.8}
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.grouphdr{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s7) 0 var(--s3)}
.grouphdr h3{margin:0}
.grouphdr span{font-size:12.5px;color:var(--text3)}

/* ── 상단바 · 2단 네비 ── 항목이 늘어도 사이드바가 길어지지 않게, 최상위는 가로로 둡니다.
   KT·KRDS·BBC·신한이 전부 이 형태입니다(data/reference-sites.json). ── */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:stretch;gap:var(--s3);
  height:var(--top);padding:0 var(--s5);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(160%) blur(12px)}
.topbar .grow{flex:1}
.tb-brand{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.ver{align-self:center}
.topbar>button,.topbar>a>button{align-self:center}
.tb-brand .dot{width:18px;height:18px;border-radius:6px;background:var(--accent);display:block}
.tb-brand b{font-size:16px;font-weight:800;letter-spacing:-.03em}
.tb-sub{font-size:12.5px;color:var(--text3);margin-left:2px}
@media(max-width:1080px){.tb-sub{display:none}}
.ver{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--text2);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap;height:fit-content}
/* 상단 섹션 네비 — 알약도 상자도 아닙니다. 밑줄 하나로만 «지금 여기»를 말합니다.
   밑줄은 상단바 하단선 위에 정확히 겹쳐 놓아 선이 두 줄로 보이지 않게 합니다. */
.topnav{display:flex;margin-left:var(--s5);align-self:stretch;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav a{position:relative;display:flex;align-items:center;padding:0 14px;font-size:14px;
  color:var(--text3);cursor:pointer;white-space:nowrap;transition:color .12s}
.topnav a:hover{color:var(--text2)}
.topnav a.on{color:var(--text);font-weight:700}
.topnav a.on:after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:var(--accent)}
.tb-search{display:flex;align-items:center;gap:7px}
.tb-btn{display:flex;align-items:center}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;
  font-size:11px;color:var(--text3);background:var(--surface)}
nav.side{top:var(--top);height:calc(100vh - var(--top));padding:var(--s5) 0 var(--s8)}
.secnav .navgrp:first-child{padding-top:0}

/* ── 페이지 메타 ── 제목 밑에 «출처 · 근거 · 갱신» 을 고정으로. Workday Canvas 형태입니다. */
.pmeta{display:grid;grid-template-columns:auto 1fr;gap:2px var(--s4);margin:calc(var(--s5)*-1) 0 var(--s6);
  font-size:13px;line-height:1.9}
.pmeta dt{color:var(--text3)}
.pmeta dd{margin:0;color:var(--text2)}
.pmeta code{font-size:12px}

/* ── 찾기 팔레트 ── */
#pal[hidden]{display:none}
#pal{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.42);
  display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;backdrop-filter:blur(2px)}
.palbox{width:min(620px,92vw);background:var(--bg);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--sh3);overflow:hidden}
#palq{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);
  font:inherit;font-size:16px;padding:var(--s4) var(--s5);outline:none}
#palr{max-height:52vh;overflow-y:auto}
#palr .r{display:flex;align-items:center;gap:var(--s3);padding:9px var(--s5);cursor:pointer;font-size:14px}
#palr .r .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:0 0 auto}
#palr .r .v{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text3)}
#palr .r.sel{background:var(--accent-soft)}
#palr .r.sel .k{border-color:var(--accent);color:var(--accent)}
#palr .none{padding:var(--s5);color:var(--text3);font-size:14px}
.palfoot{border-top:1px solid var(--line);padding:8px var(--s5);font-size:11.5px;color:var(--text3);
  display:flex;gap:5px;align-items:center}
</style>
</head>
<body>
<header class="topbar">
  <a class="tb-brand" data-go="start">
    <i class="dot"></i><b>GDS</b><span class="tb-sub">G car Design System</span>
  </a>
  <span class="ver" id="ver"></span>
  <nav class="topnav" id="topnav"></nav>
  <span class="grow"></span>
  <button id="search" class="tb-search">찾기 <kbd>/</kbd></button>
  <a href="decisions/" class="tb-btn"><button>Decisions</button></a>
  <button id="theme">Dark</button>
</header>
<div class="shell">
<nav class="side">
  <div class="secnav" id="secnav"></div>
</nav>
<main>
  <div class="inner"><div class="layout"><div id="view"></div><aside class="toc" id="toc"></aside></div></div>
</main>
</div>
<div id="toast">복사됨</div>
<div id="pal" hidden><div class="palbox">
  <input id="palq" placeholder="페이지 · 토큰 이름으로 찾기" autocomplete="off">
  <div id="palr"></div>
  <div class="palfoot"><kbd>↑</kbd><kbd>↓</kbd> 이동 · <kbd>Enter</kbd> 열기/복사 · <kbd>Esc</kbd> 닫기</div>
</div></div>

<script type="application/json" id="data">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const C=D.canon;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

/* 토큰 키 — build/tokens.js 와 동일 규칙 */
function slug(s){const p=String(s).toLowerCase().replace(/[^a-z0-9가-힣]+/g,' ').trim().split(/\s+/);
  const o=[];for(const x of p) if(!o.includes(x)) o.push(x); return o.join('-');}

const COLORS=(C.color.styles||[]).map(s=>{
  const i=s.name.indexOf('/');
  const group=i<0?'기타':s.name.slice(0,i), name=i<0?s.name:s.name.slice(i+1);
  return {group,name,full:s.name,hex:s.hex,vr:'--gds-color-'+slug(group+' '+name),
    added:!!s.added,sourceName:s.sourceName||null,alpha:s.alpha!=null?s.alpha:null};
});
const GROUP_DESC={
  'Primary':'브랜드 기본 색. Red 계열',
  'Gray Scale':'배경·라인·텍스트 등 보조 역할',
  'Navy':'뱃지·지도 핀처럼 색 자체가 정보인 요소에만 유지',
  'Badge':'혜택·프로모션 영역',
  'Map Marker':'지도 내 G car Zone 표시',
  'Brand':'제휴·외부 브랜드',
  'System':'알림·성공·포커스 등 시스템 상태',
};
const TYPES=(C.typography.scale||[]).map(t=>({...t,
  w:/Bold/i.test(t.weight||'')?700:/Medium/i.test(t.weight||'')?500:400, key:slug(t.token)}));
const CONFLICT=new Set((C.spacing.conflicts||[]).map(c=>c.token));
const SPACE=(C.spacing.scale||[]).map(s=>({...s,bad:CONFLICT.has(s.token)}));
const RADIUS=[4,8,10,12,16,20];

/* 상대 휘도·대비 — WCAG 2.1 */
function lum(hex){const v=hex.replace('#','');
  const c=[0,2,4].map(i=>parseInt(v.slice(i,i+2),16)/255)
    .map(x=>x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4));
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function ctr(a,b){const x=lum(a),y=lum(b);const [h,l]=x>y?[x,y]:[y,x];return (h+0.05)/(l+0.05);}
function ctrCell(v){const s=v.toFixed(2)+':1';
  return v>=4.5?`<span class="ok">${s} · AA 통과</span>`
       : v>=3  ?`<span>${s} · 큰 글자만</span>`
       :        `<span class="no">${s} · 미달</span>`;}

/* 본문 h2 를 훑어 우측 목차를 만듭니다 */
function buildToc(){
  const view=$('#view'),toc=$('#toc');
  const hs=[...view.querySelectorAll('h2,h3.tocable')];
  if(hs.length<2){toc.innerHTML='';return;}
  hs.forEach((h,i)=>{if(!h.id)h.id='sec'+i});
  toc.innerHTML='<div class="ttl">On this page</div>'+hs.map(h=>
    `<a data-to="${h.id}" class="${h.tagName==='H3'?'sub':''}">${esc(h.textContent.trim())}</a>`).join('');
  toc.querySelectorAll('a').forEach(a=>a.onclick=()=>{
    const t=document.getElementById(a.dataset.to);
    if(t) t.scrollIntoView({behavior:'smooth',block:'start'});});
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{if(!e.isIntersecting)return;
      toc.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.to===e.target.id));});
  },{rootMargin:'-80px 0px -70% 0px'});
  hs.forEach(h=>io.observe(h));
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1400);}
function copy(txt){navigator.clipboard?.writeText(txt).then(()=>toast(txt+' 복사됨'),()=>toast('복사 실패'));}

/* ───────── 개요 ───────── */
function start(){
  const dec=(C.color.decisions||{}), tdec=(C.typography.decisions||{});
  const main=COLORS.find(c=>c.full===((dec.main||{}).token));
  const ramp=['Primary/Red 040','Primary/Red 060','Navy/Navy 060','Navy/Navy 030','Gray Scale/Gray 040',
    'Gray Scale/Gray 020','System/Success','Badge/ODA','Map Marker/Active','Gray Scale/Gray 000']
    .map(n=>COLORS.find(x=>x.full===n)).filter(Boolean);
  return `<section class="hero"><div class="inner2">
    <p class="eyebrow">G car Design System</p>
    <h1>하나의 값,<br>세 개의 플랫폼.</h1>
    <p class="lead">웹 · iOS · Android 가 같은 값을 쓰기 위한 기준입니다.
    아래 토큰은 전부 Figma <b>정의 완료(✅) 페이지</b>에서 직접 읽은 값이며, 사람이 옮겨 적지 않았습니다.</p>
    <div class="cta">
      <a class="pri" href="tokens/gds.tokens.json" download>토큰 내려받기</a>
      <a class="sec" href="#" data-go="color">Foundation 보기</a>
      <a class="sec" href="decisions/">남은 결정</a>
    </div>
    <div class="heroramp">${ramp.map(c=>`<i style="background:${c.hex}" title="${esc(c.full)} ${c.hex}"></i>`).join('')}</div>
    <div class="herostat">
      <div><b>${COLORS.length}</b><span>색</span></div>
      <div><b>${TYPES.length}</b><span>타입 스케일</span></div>
      <div><b>${SPACE.length}</b><span>간격 단계</span></div>
      <div><b>${RADIUS.length+1}</b><span>반경 단계</span></div>
      <div><b>${(C.elevation&&C.elevation.scale.length)||0}</b><span>엘리베이션</span></div>
    </div>
  </div></section>

  <div class="sectionline"><h2>Foundation</h2><i></i></div>
  <p class="muted" style="margin-top:-8px">각 항목의 값과 사용 기준입니다.</p>
  <div class="ovgrid">
    <div class="ovcard" data-go="color">
      <div class="thumb"><div class="grid9">
        ${['Primary/Red 010','Primary/Red 040','Primary/Red 070','Gray Scale/Gray 010','Gray Scale/Gray 050','Gray Scale/Gray 080','Navy/Navy 020','Navy/Navy 050','Navy/Navy 080']
          .map(n=>{const c=COLORS.find(x=>x.full===n);return `<i style="background:${c?c.hex:'#ccc'}"></i>`}).join('')}
      </div></div>
      <div class="meta"><b>색</b><span>${COLORS.length}색 · Primary Red · Secondary Gray · Tertiary Navy</span></div>
    </div>
    <div class="ovcard" data-go="type">
      <div class="thumb"><span style="font-size:46px;font-weight:700;letter-spacing:-.03em">가나Ag</span></div>
      <div class="meta"><b>타이포그래피</b><span>${TYPES.length}단계 · ${esc(((C.typography.decisions||{}).fontFamily||{}).value||'')} 단일 · 용도로 구분</span></div>
    </div>
    <div class="ovcard" data-go="space">
      <div class="thumb"><div class="spbar">${SPACE.slice(1,10).map(x=>`<i style="height:${Math.min(x.px*2.2,58)}px"></i>`).join('')}</div></div>
      <div class="meta"><b>간격</b><span>${SPACE.length}단계 · 0 · 100 · 200 … 1300</span></div>
    </div>
    <div class="ovcard" data-go="radius">
      <div class="thumb"><span style="width:78px;height:78px;background:var(--brand);
        border-radius:20px 20px 4px 4px;display:block"></span></div>
      <div class="meta"><b>반경</b><span>${RADIUS.length+1}단계 · 상한 20px · 원형</span></div>
    </div>
    <div class="ovcard" data-go="elev">
      <div class="thumb"><div class="layers" style="width:104px">
        <i style="width:104px"></i><i style="width:88px;margin-left:8px"></i><i style="width:72px;margin-left:16px"></i></div></div>
      <div class="meta"><b>엘리베이션</b><span>${(C.elevation&&C.elevation.scale.length)||0}단계 · 재넘버링 반영</span></div>
    </div>
    <div class="ovcard" data-go="status">
      <div class="thumb"><span style="font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--text3)">${D.meta.pages}</span></div>
      <div class="meta"><b>진행 상태</b><span>Figma 페이지 ${D.meta.pages}개 · 정의 완료 현황</span></div>
    </div>
  </div>

  <div class="sectionline"><h2>확정된 기준</h2><i></i></div>
  <div class="swatches" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">
    ${main?`<div class="sw" data-copy="--gds-color-primary-main">
      <div class="chip" style="height:64px;background:${main.hex}"></div>
      <div class="info"><div class="nm">Primary 메인</div>
      <div class="hx">${esc(main.full)} · ${main.hex}</div>
      <div class="vr">--gds-color-primary-main</div></div></div>`:''}
    <div class="sw" data-copy="--gds-font-family">
      <div class="chip" style="height:64px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--text)">Ag 가</div>
      <div class="info"><div class="nm">GDS 폰트</div>
      <div class="hx">${esc((tdec.fontFamily||{}).value||'')} 단일</div>
      <div class="vr">--gds-font-family</div></div></div>
    <div class="sw" data-copy="--gds-type-line-height">
      <div class="chip" style="height:64px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text2);font-family:ui-monospace,Menlo,monospace">line-height</div>
      <div class="info"><div class="nm">행간</div>
      <div class="hx">Figma ${esc((tdec.lineHeight||{}).value||'')} · 웹 normal</div>
      <div class="vr">--gds-type-line-height</div></div></div>
    <div class="sw" data-copy="--gds-radius-20">
      <div class="chip" style="height:64px;background:var(--surface2);display:flex;align-items:center;justify-content:center">
        <span style="width:52px;height:34px;background:var(--brand);border-radius:20px 20px 4px 4px;display:block"></span></div>
      <div class="info"><div class="nm">반경 상한</div>
      <div class="hx">20px · 7단계</div>
      <div class="vr">--gds-radius-20</div></div></div>
  </div>

  <div class="sectionline"><h2>토큰 내려받기</h2><i></i></div>
  <div class="dl">
    <a href="tokens/gds.css" download><b>gds.css</b><span>CSS 커스텀 속성</span></a>
    <a href="tokens/gds.scss" download><b>gds.scss</b><span>SCSS 변수</span></a>
    <a href="tokens/gds.tokens.json" download><b>gds.tokens.json</b><span>DTCG JSON</span></a>
  </div>
  <h3>웹에서 쓰기</h3>
<pre><code>&lt;link rel="stylesheet" href="gds.css"&gt;

.button {
  background: var(--gds-color-primary-main);
  border-radius: var(--gds-radius-12);
  padding: var(--gds-spacing-400) var(--gds-spacing-500);
  font-family: var(--gds-font-family);
  font-size: var(--gds-type-title-5-size);
  font-weight: var(--gds-type-title-5-weight);
  line-height: var(--gds-type-line-height);
}</code></pre>
  <h3>토큰 이름 규칙</h3>
  <pre><code>--gds-color-{그룹}-{이름}     예) --gds-color-gray-scale-020
--gds-type-{토큰}-size|weight  예) --gds-type-title-3-size
--gds-spacing-{단계}           예) --gds-spacing-500
--gds-radius-{값}              예) --gds-radius-12 · --gds-radius-full
--gds-elevation-{단계}         예) --gds-elevation-3</code></pre>

  <div class="note"><p><b>엘리베이션 단계가 재배치되었습니다.</b>
  기존 1~5단계가 2~6단계로 밀리고 1단계가 새로 생겼습니다 —
  <a href="#" data-go="elev" style="color:var(--accent);font-weight:600;text-decoration:underline">엘리베이션 문서</a>에 대조표를 실었습니다.</p></div>
  ${footer()}`;
}

/* ───────── 색 ───────── */
function color(){
  const groups={};COLORS.forEach(c=>{(groups[c.group]=groups[c.group]||[]).push(c)});
  const order=['Primary','Gray Scale','Navy','Badge','Map Marker','Brand','System'];
  const keys=[...new Set([...order.filter(k=>groups[k]),...Object.keys(groups)])];
  const dec=(C.color.decisions||{});
  const AL=C.color.aliases;
  const main=COLORS.find(c=>c.full===((dec.main||{}).token));
  const ramp=g=>!groups[g]?'':`<div class="ramp">
    <div class="strip">${groups[g].map(c=>`<i style="background:${c.hex}" title="${esc(c.name)} ${c.hex}"></i>`).join('')}</div>
    <div class="cap"><span>${esc(g)}</span><span>${groups[g].length}단계</span></div></div>`;
  return `<div class="pagehead"><p class="eyebrow">Foundation</p><h1>Color</h1>
  <p class="lead">${esc(C.color.hierarchy.definition||'')}</p></div>
  ${pmeta({source:`<code>${esc(C.color.source||'')}</code>`,basis:esc((C.color.basis||{}).value||''),tokens:`<code>--gds-color-*</code> ${COLORS.length}색`})}

  <div class="feature">
    ${main?`<div class="big" data-copy="--gds-color-primary-main"
      style="background:linear-gradient(140deg,${main.hex},${(groups['Primary']||[]).slice(-4)[0]?groups['Primary'].slice(-4)[0].hex:main.hex})">
      <div class="role">Primary — 메인</div>
      <div class="nm">${esc(main.full)}</div>
      <div class="hx">${main.hex} · --gds-color-primary-main</div>
    </div>`:''}
    <div class="side">${ramp('Primary')}${ramp('Gray Scale')}${ramp('Navy')}</div>
  </div>

  <div class="tabs">
    <button class="on" data-pane="use">사용 기준</button>
    <button data-pane="tok">토큰 ${COLORS.length}</button>
    ${AL?`<button data-pane="alias">이름 정리</button>`:''}
  </div>

  <div class="pane" data-pane="use">
    <h2>역할</h2>
    <div class="note"><p>
      <b>Primary</b> Red scale · <b>Secondary</b> Gray scale · <b>Tertiary</b> Navy scale<br>
      Navy는 리브랜딩 이전 색으로, <b>뱃지·지도 핀처럼 색 자체가 정보인 요소에만</b> 유지하고
      폰트·컴포넌트는 Gray scale을 씁니다.</p></div>
    <p class="muted">${esc(C.color.hierarchy.primary||'')}</p>
    <p class="muted">${esc(C.color.hierarchy.secondary||'')}</p>
    <p class="muted">${esc(C.color.hierarchy.tertiary||'')}</p>

    <h2>텍스트 대비</h2>
    <p class="muted">흰 배경(<code>Gray 000</code>) 위에 각 색을 텍스트로 썼을 때의 대비입니다.
    아래 수치는 페이지에서 실제 계산한 값입니다 — WCAG 2.1 기준 본문 4.5:1 · 큰 글자 3:1.</p>
    <table class="ctr"><thead><tr><th>색</th><th>HEX</th><th>흰 배경 대비</th><th>검정(Gray 100) 대비</th></tr></thead><tbody>
    ${['Primary/Red 030','Primary/Red 040','Primary/Red 050','Primary/Red 060','Primary/Red 070',
       'Gray Scale/Gray 050','Gray Scale/Gray 060','Gray Scale/Gray 070','Gray Scale/Gray 080',
       'Navy/Navy 050','Navy/Navy 060','System/Alarm','System/Success']
      .map(n=>{const c=COLORS.find(x=>x.full===n);if(!c)return '';
        return `<tr><td><span class="dot" style="background:${c.hex}"></span>${esc(c.full)}${c.full===((C.color.decisions||{}).main||{}).token?' <b>· 메인</b>':''}</td>
        <td><code>${c.hex}</code></td><td>${ctrCell(ctr(c.hex,'#FFFFFF'))}</td><td>${ctrCell(ctr(c.hex,'#000000'))}</td></tr>`}).join('')}
    </tbody></table>
    <p class="muted"><b>메인 색은 본문 텍스트로 쓰면 AA 미달입니다.</b>
    별도 처리 없이 그대로 쓰기로 확정했으므로,

/* ── 페이지 메타 ── 제목 밑 «출처 · 근거 · 갱신» 고정 3줄.
   Workday Canvas 가 Version/Sources/Install 을 제목 밑에 고정으로 두는 형태를 따랐습니다.
   페이지마다 근거 표기 위치가 달랐던 문제를 여기서 한 번에 없앱니다. */
function pmeta(o){
  const rows=[];
  if(o.source) rows.push(['출처', o.source]);
  if(o.basis)  rows.push(['근거', o.basis]);
  if(o.tokens) rows.push(['토큰', o.tokens]);
  rows.push(['갱신', String(D.meta.exported).slice(0,10)+' · 원본 '+esc(D.meta.source)]);
  return `<dl class="pmeta">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

/* ───────── 타이포 ───────── */
function type(){
  const grp={};TYPES.forEach(t=>{const k=t.token.replace(/\s*\d+$/,'');(grp[k]=grp[k]||[]).push(t)});
  const desc={Display:'그래픽 영역 전용. 가장 큰 타이포',
    Title:'화면·영역을 대표하는 머리글',
    Heading:'반복·나열되는 구역을 구분하는 머리글',
    Body:'머리글 아래 실제 내용을 전달하는 본문',
    Caption:'본문을 보조하는 부가·주석 정보'};
  return `<div class="pagehead"><p class="eyebrow">Foundation</p><h1>Typography</h1>
  <p class="lead">위계는 Display · Title · Heading · Body · Caption 순입니다.
  아래 견본은 실제 크기와 굵기를 그대로 렌더한 것입니다.</p></div>
  ${pmeta({source:`<code>${esc(C.typography.source||'')}</code>`,basis:'Typography system (타이포 시스템) ✅ · 42066:25472 · Type scale 표',tokens:`<code>--gds-type-*</code> ${TYPES.length}단계`})}
  ${Object.entries(grp).map(([k,v])=>`
    <div class="grouphdr"><h3>${esc(k)}</h3><span>${v.length}단계 · ${esc(desc[k]||'')}</span></div>
    ${v.sort((a,b)=>b.size-a.size).map(t=>`
      <div class="tyrow" data-copy="--gds-type-${t.key}-size" style="cursor:pointer">
        <div class="tok">${esc(t.token)}</div>
        <div class="sample" style="font-size:${Math.min(t.size,34)}px;font-weight:${t.w}">언제 어디서나 간편하게 Ag 0123</div>
        <div class="spec">${(t.usage||[]).length?`<span class="use">${t.usage.map(u=>esc(u)).join(' · ')}</span>`:''}<b>${t.size}px</b> · ${t.w} · ${esc(t.lineHeight||'auto')}</div>
      </div>`).join('')}`).join('')}
  <div class="note"><b>같은 크기·굵기는 용도로 구분합니다.</b> 값이 동일한 네 쌍 — <code>Display 2</code>/<code>Heading 1</code>, <code>Display 3</code>/<code>Heading 3</code>, <code>Body 3</code>/<code>Caption 1</code>, <code>Body 4</code>/<code>Caption 2</code> — 은 쓰이는 자리가 다릅니다. 위 회색 라벨이 그 용도이고, 토큰에도 <code>$extensions.gds.usage</code> 로 실려 있습니다.</div>
  ${C.typography.library?`<h2>차기 라이브러리 — ${C.typography.library.styles.length}종</h2>
  <p class="lead" style="font-size:15px">현재 Figma 라이브러리에 등록된 텍스트 스타일은 5종인데, 원본 표는 21단계입니다.
  <b>5종은 스타일이 아니라 그룹</b>이었고, 이름에 단계 번호가 빠져 같은 이름이 여러 값으로 발행돼 있었습니다.
  ${esc(C.typography.library.namingRule||'')}</p>
  <table class="ctr"><thead><tr><th>그룹</th><th>단계</th><th>굵기</th><th>현재 이름</th><th>차기 이름</th></tr></thead><tbody>
  ${(C.typography.library.groups||[]).map(g=>`<tr><td><b>${esc(g.group)}</b></td>
    <td>${g.steps}단계</td><td>${esc(g.weightWord)} (${g.weight})</td>
    <td><code>${esc(g.currentLibraryName)}</code>${g.missing?` <span class="muted">— ${g.missing}개 없음</span>`:''}${g.typo?` <span class="muted">— 오타 ${esc(g.typo)}</span>`:''}</td>

  </tbody></table>

  <h3>페이지에 붙어 있는 외부 인용 — 편입하지 않습니다</h3>
  <div class="note warn"><p><b>${esc(q.what)}</b></p>

/* ───────── 컴포넌트 ───────── */
function comp(){

  if(!K) return `<div class="pagehead"><p class="eyebrow">Components</p><h1>Components</h1>
    <p class="lead">아직 실리지 않았습니다.</p></div>${footer()}`;
  const mark=f=>f==='done'?'✅':f==='wip'?'🚧':'—';
  const doc=K.items.filter(i=>i.documented);
  // 표/목록을 만드는 잔손질 — 원본에 있는 값만 씁니다.
  const li=(t,v)=>v?`<div class="sprow" style="grid-template-columns:150px 1fr"><div class="tok">${esc(t)}</div><div class="muted">${v}</div></div>`:'';
  const kv=o=>Object.entries(o||{}).map(([k,v])=>li(k,esc(String(v)))).join('');
  const kinds=ks=>!ks?'':`<table class="ctr"><thead><tr><th>종류</th><th>정의 · 스펙</th></tr></thead><tbody>
    ${ks.map(k=>{const {name,...rest}=k;
      const body=Object.entries(rest).filter(([kk])=>kk!=='no'&&kk!=='id'&&kk!=='node')
        .map(([kk,vv])=>`<b>${esc(kk)}</b> ${Array.isArray(vv)?vv.map(x=>esc(typeof x==='string'?x:(x.name||JSON.stringify(x)))).join(' · '):esc(String(vv))}`)
        .join('<br>');
      return `<tr><td><b>${esc(name||k.id||'')}</b></td><td class="muted">${body}</td></tr>`}).join('')}
    </tbody></table>`;
  return `<div class="pagehead"><p class="eyebrow">Components</p><h1>Components</h1>
  <p class="lead">✅ <b>[Components]</b> 구조도가 세는 ${K.counts.total}종입니다.
  원본이 아직 안 그린 것은 저장소가 지어내지 않습니다 — <b>«원본 대기»</b>로 남깁니다.</p></div>
  ${pmeta({basis:'[Components] ✅ 구조도 + 각 컴포넌트 ✅ 페이지 실측',
    tokens:`실측 ${K.counts.documented}종 · ✅ 중 ${K.counts.documentedOfDone}/${K.counts.figmaDone}`})}
  <div class="stat">
    <div><b>${K.counts.total}</b><span>구조도 전체</span></div>
    <div><b>${K.counts.figmaDone}</b><span>Figma ✅</span></div>
    <div><b>${K.counts.documented}</b><span>저장소 실측</span></div>
    <div><b>${K.counts.wip+K.counts.notStarted}</b><span>원본 대기</span></div>
  </div>
  ${K.counts.doneButUndocumented.length
    ? `<div class="note warn"><p><b>✅ 인데 저장소에 없는 것 ${K.counts.doneButUndocumented.length}종</b> —
       ${K.counts.doneButUndocumented.map(n=>esc(n)).join(' · ')}. 우리 숙제입니다.</p></div>`
    : `<div class="note"><p><b>✅ 페이지는 전부 저장소에 있습니다.</b>
       남은 ${K.counts.wip+K.counts.notStarted}종 중 일부는 🚧 이지만 <b>페이지에는 내용이 있습니다</b> —
       Text field 가 그랬습니다. «🚧 = 빈 페이지»로 세지 않고 한 장씩 열어 확인하는 중입니다.</p></div>`}

  <h2>목록</h2>

  ${K.items.map(i=>`<tr><td>${i.documented?`<b>${esc(i.name)}</b>`:esc(i.name)}${i.ko?` <span class="muted">${esc(i.ko)}</span>`:''}</td>

    <td class="${i.documented?'':'no'}">${i.documented?'실측':'원본 대기'}</td>
    <td class="muted">${i.node?`<code>${esc(String(i.node))}</code>`:''}</td></tr>`).join('')}
  </tbody></table>

  ${doc.map(i=>`
  <h2 id="c-${esc(i.name.toLowerCase().replace(/\s+/g,'-'))}">${esc(i.name)}
    <span class="muted" style="font-weight:400">${i.ko?esc(i.ko):''}</span></h2>
  ${i.definition?`<p class="lead" style="font-size:15px">${esc(i.definition)}</p>`:''}
  ${pmeta({source:i.node?`<code>${esc(String(i.node))}</code>`:'', basis:`Figma ${mark(i.figma)}`})}
  ${kinds(i.kinds)}
  ${i.anatomy?`<h3 class="tocable">구조</h3><p class="muted">${Array.isArray(i.anatomy)?i.anatomy.map(x=>esc(x)).join(' · '):esc(i.anatomy)}</p>`:''}
  ${i.specs?`<h3 class="tocable">치수</h3><div>${kv(i.specs)}</div>`:''}
  ${i.states?`<h3 class="tocable">상태</h3><table class="ctr"><thead><tr><th>상태</th><th>값</th></tr></thead><tbody>
    ${i.states.map(st=>{const {name,...rest}=st;return `<tr><td><b>${esc(name)}</b></td><td class="muted">${Object.entries(rest).map(([k,v])=>`${esc(k)} ${esc(String(v))}`).join(' · ')}</td></tr>`}).join('')}
    </tbody></table>`:''}
  ${i.colors?`<h3 class="tocable">컬러</h3><table class="ctr"><thead><tr><th>값</th><th>쓰임</th></tr></thead><tbody>
    ${i.colors.map(c2=>`<tr><td><code>${esc(c2.value)}</code></td><td class="muted">${esc(c2['쓰임']||'')}</td></tr>`).join('')}
    </tbody></table>`:''}
  ${i.spacing?`<h3 class="tocable">간격 주석 ${i.spacing.annotations}건</h3>
    <p class="muted">✅ 페이지에서 기계로 읽은 값입니다 — 이름이 붙어 있지 않아 토큰으로 만들지 않았습니다.</p>
    <div class="chips">${i.spacing.values.map(v=>`<span class="tok" style="border:1px solid var(--line);border-radius:7px;padding:3px 9px">${v.value}px <span class="muted">×${v.count}</span></span>`).join(' ')}</div>`:''}
  ${i.openMemos?`<div class="note warn"><p><b>✅ 인데 미해결 메모가 남아 있습니다.</b><br>
    ${i.openMemos.map(m=>esc(m)).join('<br>')}</p></div>`:''}

    r.resolved

       ${r.via==='decision'?`<p>${esc(r.decision.reason)}</p>`:''}
       <p class="muted">${esc(r.css||'')}</p></div>`
    : `<div class="note warn"><p><b>본문이 없는 스타일을 가리킵니다.</b> «${esc(r.quoted)}» — ${esc(r.why)}</p>
       <p class="muted">살아있는 후보 ${r.live}종 · 값이 서로 다릅니다. 어느 것을 쓰라는 뜻인지 정해질 때까지 토큰을 내보내지 않습니다(GAP-31 · SD-20).</p>
       <table class="ctr"><thead><tr><th>후보</th><th>축</th><th>값</th></tr></thead><tbody>

         <td class="muted">${esc(c2.axis)}</td><td class="muted">${esc(c2.value||'값 없음')}</td></tr>`).join('')}
       </tbody></table></div>`).join('')}

}

/* 🚧 컴포넌트 페이지를 직접 읽은 결과 — 페이지끼리 대조해 «남의 문장»을 기계로 찾았습니다. */
function wipPages(){
  const W=C.pages&&C.pages.components; if(!W) return '';
  return `<h2>🚧 컴포넌트 페이지를 직접 읽었습니다 — ${W.counts.pages}쪽</h2>
  <p class="lead" style="font-size:15px">«원본 대기»로 비워 두었던 자리입니다. 열어 보니 전부 내용이 있었습니다.</p>
  <table class="ctr"><thead><tr><th>페이지</th><th>절</th><th>텍스트</th><th>변형</th><th>빈 템플릿</th><th>노드</th></tr></thead><tbody>
  ${W.pages.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.counts.sections}</td><td>${p.counts.texts}</td>
    <td>${p.counts.variants}</td><td class="${p.counts.templateStubs?'no':''}">${p.counts.templateStubs}</td>
    <td class="muted"><code>${esc(p.source.node)}</code></td></tr>`).join('')}
  </tbody></table>

  ${W.naming.items.filter(n=>n.differs).length?`<h3>목차 이름과 페이지 이름이 다른 곳</h3>
  <table class="ctr"><thead><tr><th>목차</th><th>실제 페이지</th></tr></thead><tbody>
  ${W.naming.items.filter(n=>n.differs).map(n=>`<tr><td class="muted"><code>${esc(n.inToc)}</code></td>
    <td><b>${esc(n.pageName)}</b></td></tr>`).join('')}
  </tbody></table>
  <p class="muted">${esc(W.naming.why)}</p>`:''}

  ${W.nameMismatch&&W.nameMismatch.count?`<div class="note warn"><p><b>이름 짝이 어긋난 곳 ${W.nameMismatch.count}건.</b> ${esc(W.nameMismatch.why)}</p>
  <p class="muted">${W.nameMismatch.items.map(n=>`<code>${esc(n.found)}</code> — 영문은 ${esc(n.enBelongsTo)}, 괄호 안 한글은 ${esc(n.koBelongsTo)} 것 (${esc(n.page)} › ${esc(n.section)})`).join('<br>')}</p></div>`:''}

  <h3>남의 문장 ${W.borrowed.count+W.foreignSubjects.count}건 — 고치지 않고 표시만 합니다</h3>
  <p class="lead" style="font-size:15px">${esc(W.borrowed.why)}</p>
  <p class="muted">${esc(W.method)}</p>
  ${W.borrowed.items.length?`<table class="ctr"><thead><tr><th>남아 있는 문장</th><th>어디에</th></tr></thead><tbody>
  ${W.borrowed.items.map(b=>`<tr><td class="muted">「${esc(b.text.slice(0,140))}」</td>
    <td class="muted">${[...new Set(b.borrowedBy)].map(esc).join('<br>')}</td></tr>`).join('')}
  </tbody></table>`:''}
  ${W.foreignSubjects.items.length?`<h4>주어가 그 페이지의 컴포넌트가 아닌 문장</h4>
  <table class="ctr"><thead><tr><th>페이지 › 절</th><th>주어</th><th>문장</th></tr></thead><tbody>
  ${W.foreignSubjects.items.map(f=>`<tr><td class="muted">${esc(f.page)} › ${esc(f.section)}</td>
    <td><b>${esc(f.subject)}</b></td><td class="muted">${esc(f.text.slice(0,110))}</td></tr>`).join('')}
  </tbody></table>`:''}
  ${W.truncated.items.length?`<div class="note warn"><p><b>쓰다 만 문장 ${W.truncated.count}건.</b> ${esc(W.truncated.why)}</p>
  <p class="muted">${W.truncated.items.map(t=>`${esc(t.page)} › ${esc(t.section)} — 「${esc(t.text)}」`).join('<br>')}</p></div>`:''}

  <h3>페이지별 절</h3>
  ${W.pages.map(p=>`<h4>${esc(p.name)} <span class="muted"><code>${esc(p.source.node)}</code></span></h4>
  <table class="ctr"><thead><tr><th>절</th><th>본문</th></tr></thead><tbody>
  ${p.sections.map(s=>`<tr><td><b>${esc(s.title)}</b><br><span class="muted"><code>${esc(s.node)}</code></span></td>
    <td class="muted">${esc(s.lead||'—')}${s.rows.length>1?`<br><span style="opacity:.7">${s.rows.slice(1,6).map(r=>esc(r.slice(0,90))).join(' · ')}</span>`:''}</td></tr>`).join('')}
  ${p.docTemplate?'':`<tr><td class="muted">문서화 템플릿 없음</td>
    <td class="muted">작업 메모만 있습니다 — 빈 페이지가 아닙니다.<br>${p.workNotes.slice(0,5).map(n=>`<code>${esc(n.node)}</code> ${esc(n.text.slice(0,120))}`).join('<br>')}</td></tr>`}
  </tbody></table>`).join('')}

/* «시작 전(—)» 으로 세던 8쪽 — 표시만 보고 «없다»고 하지 않기 위해 직접 열어 봤습니다. */
function notStarted(){
  const N=C.pages&&C.pages.notStarted; if(!N) return '';
  const LBL={empty:'정말로 빈 페이지','template-only':'문서 틀만 있음','documented-but-contaminated':'문서 있으나 남의 내용',
    'spec-outside-template':'틀 밖에 스펙이 있음','screens-only':'화면만 있음'};
  return `<h2>«시작 전(—)» 으로 세던 ${N.summary.checked}쪽도 열어 봤습니다</h2>
  <p class="lead" style="font-size:15px">${esc(N.why)}</p>
  <div class="stat">
    <div><b>${N.summary.checked}</b><span>확인한 쪽</span></div>
    <div><b>${N.summary.empty}</b><span>정말로 빈 쪽</span></div>
    <div><b>${N.summary.checked-N.summary.empty}</b><span>내용이 있던 쪽</span></div>
    <div><b>${N.summary.documentedButContaminated}</b><span>오염된 문서</span></div>
  </div>
  <p class="lead" style="font-size:15px"><b>${esc(N.summary.reading)}</b></p>
  <table class="ctr"><thead><tr><th>페이지</th><th>상태</th><th>찾은 것</th><th>근거</th></tr></thead><tbody>
  ${N.pages.map(p=>`<tr><td><b>${esc(p.name)}</b>${p.transcribed?' <span class="badge">옮겨 적음</span>':''}</td>
    <td class="${p.state==='empty'?'no':''}">${esc(LBL[p.state]||p.state)}</td>
    <td class="muted">${esc(p.finding)}
    ${p.contamination?`<br>${p.contamination.map(c=>`<b>${esc(c.what)}</b> — 「${esc(c.text)}」 <code>${esc(c.node)}</code>`).join('<br>')}`:''}
    ${p.spec?`<br>${p.spec.map(s=>`<b>${esc(s.file)}</b> ${esc(s.kind)} · ${esc(s.hex)} · ${esc(s.size)} · ${s.fps}fps <code>${esc(s.node)}</code>`).join('<br>')}`:''}
    ${p.toBe?`<br><b>To-be ${esc(p.toBe.state)}</b> — 「${esc(p.toBe.text)}」`:''}
    ${p.motionNote?`<br>모션 메모 — 「${esc(p.motionNote)}」`:''}</td>
    <td class="muted"><code>${esc(p.node)}</code>${p.parsed?`<br>${esc(p.parsed)}`:''}</td></tr>`).join('')}
  </tbody></table>
  <div class="note"><p class="muted">${N.rule.map(esc).join('<br>')}</p>
  <p class="muted">${esc(N.how)}</p></div>`;
}

/* ───────── 진행 상태 ───────── */
function status(){
  const rows=[
    ['색',`${COLORS.length}색 · 7그룹`,'ok','원본 확보'],
    ['타이포그래피',`${TYPES.length}단계`,'ok','원본 확보'],
    ['간격',`${SPACE.length}단계`,'ok','토큰명 순차 재정리 완료'],
    ['반경','7단계 · 상한 20px','ok','R-3 확정 반영'],
    ['엘리베이션','6단계 · 재넘버링 반영','ok','1단계 레이어 수만 재확인 필요'],
    ['레이아웃',`${C.layout?['screen','margin','safeArea','header'].reduce((n,g)=>n+((C.layout[g]||[]).length),0):0}종`,'ok','Guidelines 계층 — Layout ✅ 페이지'],
    ['시맨틱',`색 ${C.semantic?C.semantic.tokens.length:0} · 타이포 ${C.typography.semantic?C.typography.semantic.tokens.length:0}`,'ok','✅ 페이지 본문 근거 필수'],
    ['컴포넌트','—','wait','Foundation 안정화 후'],
  ];
  const G=C.gapSummary;
  const badge=s=>s==='ok'?'<span style="color:var(--ok);font-weight:700">준비됨</span>'
    :s==='warn'?'<span style="color:var(--warn);font-weight:700">보류</span>'
    :'<span style="color:var(--text3)">예정</span>';
  return `<div class="pagehead"><p class="eyebrow">Reference</p><h1>Status</h1>
  <p class="lead">이 문서에 실린 값이 어디까지 확정됐는지입니다. 확정되지 않은 것은 싣지 않습니다.</p></div>
  ${pmeta({basis:`Figma 페이지 ${D.meta.pages}개 중 ✅ 표시된 것만`})}
  <div style="margin-top:24px">
  ${rows.map(([a,b,s,c])=>`<div class="sprow" style="grid-template-columns:130px 130px 90px 1fr">
    <div style="font-weight:600">${a}</div><div class="muted" style="text-align:left">${b}</div>
    <div>${badge(s)}</div><div class="muted">${c}</div></div>`).join('')}</div>
  ${G?`<h2>디자인 시스템으로서 모자란 곳 — ${G.total}건 중 ${G.resolved}건 메움</h2>
  <p class="lead" style="font-size:15px">원본을 옮겨 적는 것이 아니라, <b>✅ 항목이 디자인 시스템으로서 모자란 곳을 찾아 메우는 것</b>이
  이 저장소의 일입니다. 남은 ${G.open}건과 각 건의 근거는 <a href="decisions/">결정 안건</a>에 있습니다.</p>
  <div class="stat">
    <div><b>${G.total}</b><span>찾은 것</span></div>
    <div><b>${G.resolved}</b><span>메운 것</span></div>
    <div><b>${G.open}</b><span>남은 것</span></div>
    <div><b>0</b><span>손으로 적은 수치</span></div>
  </div>`:''}
  <h2>이 문서가 만들어지는 방식</h2>
  <p class="lead" style="font-size:15px">원본 <code>.fig</code> 파일을 직접 디코딩해 값을 읽고, 기계 검증을 통과한 것만 사이트와 토큰 파일로 내보냅니다.
  손으로 옮겨 적는 단계가 없어 원본과 어긋날 수 없습니다.</p>
<pre><code>GDS(Greencar Design System).fig
   ↓  npm run canon      ✅ 페이지에서 원본 추출
   ↓  npm run tokens     CSS / SCSS / JSON 생성
   ↓  npm run build      사이트 생성
   ↓  npm run check      기계 검증 — 실패 시 배포 중단</code></pre>
  ${footer()}`;
}

function footer(){
  return `<footer>
    원본 <code>${esc(D.meta.source)}</code> · export ${String(D.meta.exported).slice(0,10)}<br>
    ✅ 정의 완료 페이지에서 추출한 원본만 싣습니다. 정리되지 않은 레거시 스타일은 포함하지 않습니다.
  </footer>`;
}

/* ───────── 라우팅 ───────── */
function bindTabs(){
  document.querySelectorAll('.tabs').forEach(bar=>{
    const btns=[...bar.querySelectorAll('button')];
    btns.forEach(b=>b.onclick=()=>{
      btns.forEach(x=>x.classList.toggle('on',x===b));
      const scope=bar.parentElement;
      scope.querySelectorAll(':scope > .pane').forEach(pn=>pn.hidden=(pn.dataset.pane!==b.dataset.pane));
    });
  });
}

  실제 페이지는 <code>${esc(P.naming.pageName)}</code> 입니다. ${esc(P.naming.note)}</p></div>

  <div class="sprow" style="grid-template-columns:150px 1fr"><div class="tok">Property 1</div>
    <div class="muted">${V2.kinds.map(k=>esc(k)).join(' · ')}</div></div>
  <div class="sprow" style="grid-template-columns:150px 1fr"><div class="tok">Property 2</div>
    <div class="muted">${V2.states.map(k=>esc(k)).join(' · ')}</div></div>
  <table class="ctr" style="margin-top:16px"><thead><tr><th>변형</th><th>크기</th><th>노드</th></tr></thead><tbody>
  ${V2.items.map(i=>`<tr><td><code>${esc(i.name)}</code></td><td class="muted">${i.w}×${i.h}</td>
    <td class="muted"><code>${esc(i.id)}</code></td></tr>`).join('')}
  </tbody></table>

  <h2>원본 결함 ${P.counts.defects}건 — 고치지 않고 적습니다</h2>
  ${P.defects.map(d=>`<div class="note warn"><p><b>${esc(d.id)} · ${esc(d.what)}</b></p>
    <p>${esc(d.why)}</p><p class="muted">${esc(d.fix)}</p>
    ${d.evidence?`<p class="muted">근거 — ${Array.isArray(d.evidence)?d.evidence.map(e=>`<code>${esc(e)}</code>`).join('<br>'):esc(d.evidence)}</p>`:''}
  </div>`).join('')}

  <h2>토큰 이름 규칙</h2>
  <div class="note"><p><b>${esc(P.tokenNaming.shape)}</b></p>
  <p class="muted">${esc(P.tokenNaming.note)}</p>
  <p class="muted">${P.tokenNaming.examples.map(e=>`<code>${esc(e)}</code>`).join('<br>')}</p></div>

  <div class="note"><p><b>아직 비어 있는 절</b> — ${P.stillEmpty.sections.map(esc).join(' · ')}.
  ${esc(P.stillEmpty.why)}</p></div>
  ${footer()}`;
}

const V={start,color,type,space,icon,radius,elev,layout,semantic,comp,tfield,status};

/* 2단 네비 — 최상위는 가로(topnav), 사이드바는 «지금 섹션 안»만 그립니다.
   컴포넌트가 25종 들어와도 사이드바 길이가 늘지 않습니다. */
const NAV=[
  {sec:'Get started', items:[['start','Overview']]},
  {sec:'Foundation',  items:[['color','Color'],['type','Typography'],['space','Spacing'],
                             ['icon','Icon'],['radius','Radius'],['elev','Elevation']]},
  {sec:'Semantic',    items:[['semantic','Tokens']]},
  {sec:'Guidelines',  items:[['layout','Layout']]},
  {sec:'Components',  items:[['comp','Components'],['tfield','Text field']]},
  {sec:'Reference',   items:[['status','Status']]},
];
const SEC_OF={}; NAV.forEach(g=>g.items.forEach(([k])=>SEC_OF[k]=g.sec));
const LABEL={};  NAV.forEach(g=>g.items.forEach(([k,l])=>LABEL[k]=l));
/* 뷰 함수와 네비 항목이 어긋나면 눌렀을 때 빈 화면이 됩니다 — 로드 시점에 세웁니다. */
for(const k of Object.keys(LABEL)) if(!V[k]) throw new Error('네비 항목에 뷰 함수가 없습니다: '+k);
for(const k of Object.keys(V)) if(!LABEL[k]) throw new Error('뷰 함수가 네비에 없습니다: '+k);

$('#topnav').innerHTML=NAV.map(g=>`<a data-sec="${g.sec}">${g.sec}</a>`).join('');
$('#ver').textContent=(D.meta.version?'v'+D.meta.version:'')+' · '+String(D.meta.exported).slice(0,10);

function paintNav(k){
  const sec=SEC_OF[k];
  const grp=NAV.find(g=>g.sec===sec);
  $('#secnav').innerHTML=`<div class="navgrp">${sec}</div>`+
    grp.items.map(([kk,l])=>`<a class="item${kk===k?' on':''}" data-go="${kk}">${l}</a>`).join('');
  $('#secnav').querySelectorAll('a.item').forEach(a=>a.onclick=()=>go(a.dataset.go));
  $('#topnav').querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.sec===sec));
}
$('#topnav').querySelectorAll('a').forEach(a=>a.onclick=()=>{
  go(NAV.find(g=>g.sec===a.dataset.sec).items[0][0]);
});
$('.tb-brand').onclick=()=>go('start');

function go(k){
  if(!V[k])return;
  $('#view').innerHTML=V[k]();
  paintNav(k);
  location.hash=k==='start'?'':('#'+k);
  window.scrollTo(0,0);
  document.querySelectorAll('[data-copy]').forEach(e=>e.onclick=ev=>{ev.preventDefault();copy(e.dataset.copy)});
  document.querySelectorAll('#view a[data-go],#view [data-go]').forEach(a=>a.onclick=ev=>{ev.preventDefault();go(a.dataset.go)});
  bindTabs();
  buildToc();
}

/* ── 찾기 ── 페이지와 토큰 이름을 한 곳에서. Apple·Shopify·Fluent 가 사이드바 최상단에 두는 것과 같은 일. */
const INDEX=(()=>{
  const out=Object.entries(LABEL).map(([k,l])=>({kind:'page',label:l,sub:SEC_OF[k],go:k}));
  for(const c of COLORS) out.push({kind:'color',label:c.full,sub:c.hex,copy:c.vr,go:'color'});
  for(const t of TYPES)  out.push({kind:'type',label:t.token,sub:t.size+'px · '+t.w,copy:'--gds-type-'+t.key+'-size',go:'type'});
  for(const x of SPACE)  out.push({kind:'space',label:x.token,sub:x.px+'px',copy:'--gds-spacing-'+x.token.replace('Spacing_',''),go:'space'});
  if(C.layout) for(const g of ['screen','margin','safeArea','header']) for(const l of (C.layout[g]||[]))
    out.push({kind:'layout',label:l.token,sub:l.value+(l.unit||'px'),copy:'--gds-layout-'+slug(l.token),go:'layout'});
  if(C.semantic) for(const t of C.semantic.tokens)
    out.push({kind:'semantic',label:t.token,sub:t.ref,copy:'--gds-'+slug(t.token.replace(/^Semantic\//,'').replace(/\//g,' ')),go:'semantic'});
  if(C.typography.semantic) for(const t of C.typography.semantic.tokens)
    out.push({kind:'semantic',label:t.token,sub:t.refCanon,copy:'--gds-type-semantic-'+t.role+'-size',go:'semantic'});
  return out;
})();
let palSel=0, palHits=[];
function palRender(q){
  const s=q.trim().toLowerCase();
  palHits=(s?INDEX.filter(r=>(r.label+' '+(r.sub||'')+' '+(r.copy||'')).toLowerCase().includes(s)):INDEX).slice(0,40);
  palSel=0;
  $('#palr').innerHTML=palHits.length?palHits.map((r,i)=>
    `<div class="r${i===0?' sel':''}" data-i="${i}"><span class="k">${r.kind}</span>
     <span>${esc(r.label)}</span><span class="v">${esc(r.copy||r.sub||'')}</span></div>`).join('')
    :'<div class="none">찾는 것이 없습니다.</div>';
  $('#palr').querySelectorAll('.r').forEach(el=>el.onclick=()=>palPick(+el.dataset.i));
}
function palMove(d){
  if(!palHits.length)return;
  palSel=(palSel+d+palHits.length)%palHits.length;
  $('#palr').querySelectorAll('.r').forEach((el,i)=>el.classList.toggle('sel',i===palSel));
  const el=$('#palr').querySelectorAll('.r')[palSel]; if(el)el.scrollIntoView({block:'nearest'});
}
function palPick(i){
  const r=palHits[i]; if(!r)return;
  palClose(); go(r.go); if(r.copy) copy(r.copy);
}
function palOpen(){ $('#pal').hidden=false; $('#palq').value=''; palRender(''); $('#palq').focus(); }
function palClose(){ $('#pal').hidden=true; }
$('#search').onclick=palOpen;
$('#pal').onclick=e=>{if(e.target.id==='pal')palClose()};
$('#palq').oninput=e=>palRender(e.target.value);
document.addEventListener('keydown',e=>{
  if($('#pal').hidden){
    const typing=/^(INPUT|TEXTAREA)$/.test((e.target.tagName||''));
    if(!typing&&(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key==='k'))){e.preventDefault();palOpen();}
    return;
  }
  if(e.key==='Escape'){palClose();}
  else if(e.key==='ArrowDown'){e.preventDefault();palMove(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();palMove(-1);}
  else if(e.key==='Enter'){e.preventDefault();palPick(palSel);}
});

$('#theme').onclick=()=>{const r=document.documentElement,d=r.getAttribute('data-theme')==='dark';
  r.setAttribute('data-theme',d?'light':'dark');$('#theme').textContent=d?'Dark':'Light'};
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1)||'start'; if(V[k])go(k);});
go(location.hash.slice(1)&&V[location.hash.slice(1)]?location.hash.slice(1):'start');
</script>
</body>
